<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta Tags -->
    <title>{{ blog.meta_title|default:blog.title }}</title>
    <meta name="title" content="{{ blog.meta_title|default:blog.title }}">
    <meta name="description" content="{{ blog.meta_description|default:blog.excerpt|striptags|truncatewords:30 }}">
    <meta name="author" content="{{ blog.author }}">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{ request.build_absolute_uri }}">
    <meta property="og:title" content="{{ blog.meta_title|default:blog.title }}">
    <meta property="og:description" content="{{ blog.meta_description|default:blog.excerpt|striptags|truncatewords:30 }}">
    {% if blog.image %}
    <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{{ blog.image.url }}">
    {% endif %}
    <meta property="article:published_time" content="{{ blog.created_at|date:'c' }}">
    <meta property="article:author" content="{{ blog.author }}">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="{{ request.build_absolute_uri }}">
    <meta property="twitter:title" content="{{ blog.meta_title|default:blog.title }}">
    <meta property="twitter:description" content="{{ blog.meta_description|default:blog.excerpt|striptags|truncatewords:30 }}">
    {% if blog.image %}
    <meta property="twitter:image" content="{{ request.scheme }}://{{ request.get_host }}{{ blog.image.url }}">
    {% endif %}
    
    <!-- Canonical URL -->
    <link rel="canonical" href="{{ request.build_absolute_uri }}">
    
    <!-- Schema.org structured data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "BlogPosting",
        "headline": "{{ blog.title|escapejs }}",
        "image": {% if blog.image %}"{{ request.scheme }}://{{ request.get_host }}{{ blog.image.url }}"{% else %}""{% endif %},
        "author": {
            "@type": "Person",
            "name": "{{ blog.author|escapejs }}"
        },
        "datePublished": "{{ blog.created_at|date:'c' }}",
        "description": "{{ blog.meta_description|default:blog.excerpt|striptags|truncatewords:30|escapejs }}"
    }
    </script>
</head>
<body>
    <article itemscope itemtype="https://schema.org/BlogPosting">
        <header>
            <h1 itemprop="headline">{{ blog.title }}</h1>
            <meta itemprop="datePublished" content="{{ blog.created_at|date:'c' }}">
            <meta itemprop="author" content="{{ blog.author }}">
            {% if blog.image %}
                <img src="{{ blog.image.url }}" alt="{{ blog.title }}" itemprop="image">
            {% endif %}
        </header>
        
        <div itemprop="articleBody">
            {{ blog.content|safe }}
        </div>
        
        <footer>
            <p>Author: <span itemprop="author">{{ blog.author }}</span></p>
            <p>Published: <time datetime="{{ blog.created_at|date:'c' }}">{{ blog.created_at|date:"F d, Y" }}</time></p>
        </footer>
    </article>
</body>
</html>
